<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>10PRINT CRT Vanilla</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: black;
  }

  #app {
    display: flex;
    height: 100%;
    width: 100%;
    color: #00ff00;
    font-family: monospace;
  }

  #ui {
    width: 220px;
    padding: 10px;
    background: #050505;
    border-right: 1px solid #00ff00;
    box-sizing: border-box;
  }

  #canvasContainer {
    flex: 1;
    position: relative;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  label {
    display: block;
    margin-top: 10px;
    font-size: 12px;
    cursor: help;
  }

  input {
    width: 100%;
  }

  button {
    width: 100%;
    margin-top: 10px;
    padding: 6px;
    background: black;
    color: #00ff00;
    border: 1px solid #00ff00;
    cursor: pointer;
  }

  button:hover {
    background: #001100;
  }
</style>
</head>
<body>

<div id="app">
  <div id="ui">

    <button id="toggle"
      title="Enciende o pausa la animación. Usa la persistencia para simular apagado de pantalla.">
      ⏸ Pausa
    </button>

    <label title="Controla el tamaño de cada celda cuadrada. Valores altos = menos detalle, valores bajos = más densidad.">
      Tamaño celda
      <input type="range" id="cellSize" min="4" max="30" value="27">
    </label>

    <label title="Define cada cuánto se redibuja la pantalla (en milisegundos). Valores bajos = animación más rápida.">
      Velocidad
      <input type="range" id="speed" min="10" max="200" value="150">
    </label>

    <label title="Probabilidad de que una celda cambie en cada frame. A mayor valor, más movimiento.">
      Cambio aleatorio
      <input type="range" id="changeRate" min="0" max="0.1" step="0.005" value="0.01">
    </label>

    <label title="Controla cuánto persiste el dibujo anterior. Simula el efecto de fósforo CRT.">
      Persistencia 
      <input type="range" id="fade" min="0.0" max="0.3" step="0.01" value="0.1">
    </label>

    <label title="Define el grosor de las líneas diagonales.">
      Grosor línea
      <input type="range" id="lineWidth" min="1" max="4" value="2">
    </label>

    <label title="Simula el brillo del fósforo del monitor. Valores altos = más resplandor.">
      Glow
      <input type="range" id="glow" min="0" max="20" value="0">
    </label>

  </div>

  <div id="canvasContainer">
    <canvas id="screen"></canvas>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d");
  const container = document.getElementById("canvasContainer");

  const toggleBtn = document.getElementById("toggle");
  const fadeSlider = document.getElementById("fade");

  const settings = {
    cellSize: 27,
    speed: 150,
    changeRate: 0.01,
    fade: 0.01,
    lineWidth: 2,
    glow: 0
  };

  let cols, rows, grid, loop;
  let isRunning = true;
  let lastFade = settings.fade;

  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }

  function initGrid() {
    cols = Math.floor(canvas.width / settings.cellSize);
    rows = Math.floor(canvas.height / settings.cellSize);

    grid = new Array(rows);
    for (let y = 0; y < rows; y++) {
      grid[y] = new Array(cols);
      for (let x = 0; x < cols; x++) {
        grid[y][x] = Math.random() < 0.5 ? 0 : 1;
      }
    }
  }

  function draw() {
    ctx.fillStyle = "rgba(0,0,0," + (0.3 - settings.fade) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#00ff00";
    ctx.lineWidth = settings.lineWidth;
    ctx.shadowColor = "#00ff00";
    ctx.shadowBlur = settings.glow;

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const px = x * settings.cellSize;
        const py = y * settings.cellSize;

        ctx.beginPath();

        if (grid[y][x] === 0) {
          ctx.moveTo(px, py + settings.cellSize);
          ctx.lineTo(px + settings.cellSize, py);
        } else {
          ctx.moveTo(px, py);
          ctx.lineTo(px + settings.cellSize, py + settings.cellSize);
        }

        ctx.stroke();

        if (Math.random() < settings.changeRate) {
          grid[y][x] = 1 - grid[y][x];
        }
      }
    }
  }

  function restartLoop() {
    clearInterval(loop);
    if (isRunning) {
      loop = setInterval(draw, 220 - settings.speed);
    }
  }

  function toggle() {
    isRunning = !isRunning;

    if (!isRunning) {
      // Guardar valor actual y "apagar"
      lastFade = settings.fade;
      settings.fade = 0.3;
      fadeSlider.value = 0.3;
      clearInterval(loop);
      toggleBtn.textContent = "▶ Play";
    } else {
      // Restaurar persistencia
      settings.fade = lastFade;
      fadeSlider.value = lastFade;
      restartLoop();
      toggleBtn.textContent = "⏸ Pause";
    }
  }

  toggleBtn.addEventListener("click", toggle);

  function setupControls() {
    const ids = ["cellSize","speed","changeRate","fade","lineWidth","glow"];

    for (let i = 0; i < ids.length; i++) {
      const el = document.getElementById(ids[i]);

      el.addEventListener("input", function () {
        settings[ids[i]] = parseFloat(this.value);

        if (ids[i] === "fade" && isRunning) {
          lastFade = settings.fade;
        }

        if (ids[i] === "cellSize") {
          initGrid();
        }

        if (ids[i] === "speed") {
          restartLoop();
        }
      });
    }
  }

  function init() {
    resizeCanvas();
    initGrid();
    setupControls();
    restartLoop();
  }

  window.addEventListener("resize", function () {
    resizeCanvas();
    initGrid();
  });

  init();
})();
</script>

</body>
</html>
